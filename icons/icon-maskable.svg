  <!-- Full-bleed background; artwork stays inside the 80% maskable safe zone (radius 205). -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0" r="1.1">
      <stop offset="0" stop-color="#131c33" />
      <stop offset="1" stop-color="#070b14" />
    </radialGradient>
    <radialGradient id="sphere" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#e0f2fe" />
      <stop offset="0.35" stop-color="#38bdf8" />
      <stop offset="0.75" stop-color="#2563eb" />
      <stop offset="1" stop-color="#1e2a6e" />
    </radialGradient>
    <clipPath id="ring-front">
      <rect x="0" y="256" width="512" height="256" transform="rotate(-22 256 256)" />
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <g fill="none" stroke="#c084fc" stroke-width="16">
    <ellipse cx="256" cy="256" rx="196" ry="60" transform="rotate(-22 256 256)" />
  </g>
  <circle cx="256" cy="256" r="136" fill="url(#sphere)" />
  <g fill="none" stroke="#c084fc" stroke-width="16" clip-path="url(#ring-front)">
    <ellipse cx="256" cy="256" rx="196" ry="60" transform="rotate(-22 256 256)" />
  </g>
</svg>
