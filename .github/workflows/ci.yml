name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify Service Worker and package.json version parity
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const sw = fs.readFileSync('./sw.js', 'utf8');
            if (!sw.includes(\`APP_VERSION = '\${pkg.version}'\`)) {
              console.error('SW APP_VERSION does not match package.json version ' + pkg.version);
              process.exit(1);
            }
          "

      - name: Verify the release tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== 'v' + pkg.version) {
              console.error('Tag ' + tag + ' does not match package.json version ' + pkg.version);
              process.exit(1);
            }
          "

      - name: Run test suite
        run: npm test
